[package]
name = "examples-axum-prometheus"
publish = false
edition.workspace = true
version.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
axum = { workspace = true, default-features = true }
axum-tracing-opentelemetry = { path = "../../axum-tracing-opentelemetry", features = [
  "metrics-prometheus",
] }
init-tracing-opentelemetry = { path = "../../init-tracing-opentelemetry", features = [
  "tracing_subscriber_ext",
  "metrics-prometheus",
] }
opentelemetry = { workspace = true }
serde_json = "1"
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }
